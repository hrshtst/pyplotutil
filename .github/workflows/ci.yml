name: ci

on:
  push:
    branches: [main, develop, "ci/**"]
    paths-ignore:
      - "README.md"
    tags:
      - "*"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  LANG: en_US.utf-8
  LC_ALL: en_US.utf-8
  PYTHONIOENCODING: UTF-8
  FORCE_COLOR: 3

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Run lint and type check
        run: uvx --from 'nox[uv]' nox --non-interactive --error-on-missing-interpreters --session lint typecheck

  tests:
    timeout-minutes: 10
    strategy:
      max-parallel: 4
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
        # - macos-latest
        # - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ${{ matrix.os }}
    # ubuntu-26.04 is a preview runner image; promote it to required once it is GA.
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Run tests on ${{ matrix.os }}
        run: uvx --from 'nox[uv]' nox --non-interactive --error-on-missing-interpreters --session "tests-${{ matrix.python-version }}" -- --full-trace --cov

